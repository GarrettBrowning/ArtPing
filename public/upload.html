<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Upload</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <div class="nav-links">
        <a href="upload.html" class="active">Upload</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </div>
    </nav>

    <main class="upload-container">
      <div class="upload-header">
        <h2>Upload Artwork</h2>
        <div class="server-message"></div>
      </div>

      <div class="input-div" id="drop-zone">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
        <p>Drop image here or <span class="browse">browse</span></p>
        <span class="upload-hint">PNG, JPG up to 10MB</span>
        <input type="file" class="file" id="file-input" accept="image/png, image/jpeg, image/jpg">
      </div>

      <div id="preview-container" style="display:none;">
        <div class="queued-div">
          <div class="image">
            <img id="preview-img" src="" alt="preview">
            <span id="remove-btn">&times;</span>
          </div>
        </div>

        <form id="upload-form" class="auth-form" style="margin-top: 24px;">
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Enter a title" required>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="Optional description">
          </div>
          <div class="auth-actions">
            <button type="button" class="btn-outline" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn-primary">Upload</button>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const previewContainer = document.getElementById('preview-container');
    const previewImg = document.getElementById('preview-img');
    const removeBtn = document.getElementById('remove-btn');
    const cancelBtn = document.getElementById('cancel-btn');
    const uploadForm = document.getElementById('upload-form');
    const serverMessage = document.querySelector('.server-message');
    let selectedFile = null;

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) showPreview(fileInput.files[0]);
    });

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      const file = e.dataTransfer.files[0];
      if (file && file.type.match('image')) showPreview(file);
    });

    dropZone.addEventListener('dragover', (e) => e.preventDefault());

    function showPreview(file) {
      selectedFile = file;
      previewImg.src = URL.createObjectURL(file);
      previewContainer.style.display = 'block';
    }

    function clearPreview() {
      selectedFile = null;
      previewImg.src = '';
      previewContainer.style.display = 'none';
      fileInput.value = '';
      uploadForm.reset();
    }

    removeBtn.addEventListener('click', clearPreview);
    cancelBtn.addEventListener('click', clearPreview);

    uploadForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!selectedFile) return;

      const formData = new FormData();
      formData.append('image', selectedFile);
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);

      const res = await fetch('/api/upload', {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        serverMessage.textContent = 'Upload successful!';
        serverMessage.style.cssText = 'background-color: #d4edda; color: #155724; padding: 10px 16px; border-radius: 4px;';
        clearPreview();
      } else {
        const text = await res.text();
        serverMessage.textContent = text;
        serverMessage.style.cssText = 'background-color: #f8d7da; color: #b71c1c; padding: 10px 16px; border-radius: 4px;';
      }
    });
  </script>
</body>
</html>
