<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Upload artwork</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <meta name="description" content="Upload your artwork to share it with the ArtPing community.">
  <meta name="theme-color" content="#f5f3f0">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script src="/nav.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
<div class="app">
    <nav class="nav">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <div class="nav-links">
        <a href="feed.html">Feed</a>
        <a id="profile-link" href="#" class="show-signed-in">Profile</a>
        <a href="upload.html" class="active">Upload</a>
        <a href="reports.html" class="show-admin">Reports</a>
        <a href="settings.html" class="show-signed-in">Settings</a>
        <a href="login.html" class="show-signed-out">Login</a>
        <a href="register.html" class="show-signed-out">Register</a>
        <button id="logout" class="btn-ghost show-signed-in">Logout</button>
      </div>
    </nav>

    <main class="upload-container" id="main-content">
      <div class="upload-header">
        <h2>Upload Artwork</h2>
        <div class="server-message"></div>
      </div>

      <p class="settings-logged-out show-signed-out">
        Sorry, you must be logged in to upload artwork. <a href="login.html">Log in</a>
      </p>

      <div class="input-div show-signed-in" id="drop-zone">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5"/></svg>
        <p>Drop image here or <span class="browse">browse</span></p>
        <span class="upload-hint">JPG, PNG, WebP or GIF, up to 10 MB</span>
        <input type="file" class="file" id="file-input" accept="image/png, image/jpeg, image/webp, image/gif">
      </div>

      <div id="preview-container" style="display:none;">
        <div class="queued-div">
          <div class="image">
            <img id="preview-img" src="" alt="preview">
            <span id="remove-btn">&times;</span>
          </div>
        </div>

        <form id="upload-form" class="auth-form" style="margin-top: 24px;">
          <div class="field">
            <label for="title">Title</label>
            <input type="text" id="title" name="title" placeholder="Enter a title" maxlength="100" required>
          </div>
          <div class="field">
            <label for="description">Description</label>
            <input type="text" id="description" name="description" placeholder="Optional description" maxlength="1000">
          </div>
          <div class="auth-actions">
            <button type="button" class="btn-outline" id="cancel-btn">Cancel</button>
            <button type="submit" class="btn-primary">Upload</button>
          </div>
        </form>
      </div>
    </main>

    <footer class="site-footer">
      <p>&copy; %YEAR% ArtPing</p>
      <nav aria-label="Footer">
        <a href="/about.html">About</a>
      </nav>
    </footer>
  </div>

  <script src="/js/upload.js"></script>
</body>
</html>
