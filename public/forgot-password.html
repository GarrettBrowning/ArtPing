<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Forgot Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <p>Your creative space.</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Forgot Password</h2>
      <p class="auth-sub">Enter the email you signed up with and we'll send you a link to choose a new password.</p>

      <p id="success-msg" class="form-success" style="display: none;"></p>
      <p id="error-msg" style="color: red; display: none;"></p>
      <form id="forgot-form" class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn-primary full-width">Send reset link</button>
        <p class="forgot"><a href="login.html">Back to login</a></p>
      </form>
    </div>
  </div>

<script>
  const form = document.getElementById('forgot-form');
  const errorMsg = document.getElementById('error-msg');
  const successMsg = document.getElementById('success-msg');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const button = form.querySelector('button[type="submit"]');
    errorMsg.style.display = 'none';
    button.disabled = true;

    try {
      const res = await fetch('/api/password/forgot', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value })
      });
      if (!res.ok) throw new Error(await res.text());
      const data = await res.json();
      successMsg.textContent = data.message;
      successMsg.style.display = 'block';
      form.style.display = 'none';
    } catch (err) {
      errorMsg.textContent = err.message || "Sorry, we couldn't reach the server. Please check your connection and try again.";
      errorMsg.style.display = 'block';
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
