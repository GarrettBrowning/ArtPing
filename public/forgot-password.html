<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Forgot password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <meta name="description" content="Reset your ArtPing password. We'll email you a link to choose a new one.">
  <meta name="theme-color" content="#f5f3f0">
  <meta name="robots" content="noindex">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
<main class="auth-page" id="main-content">
    <div class="auth-brand">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <p>Your creative space.</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Forgot Password</h2>
      <p class="auth-sub">Enter the email you signed up with and we'll send you a link to choose a new password.</p>

      <p id="success-msg" class="form-success" style="display: none;"></p>
      <p id="error-msg" style="color: red; display: none;"></p>
      <form id="forgot-form" class="auth-form">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <button type="submit" class="btn-primary full-width">Send reset link</button>
        <p class="forgot"><a href="login.html">Back to login</a></p>
      </form>
    </div>
    <footer class="site-footer">
      <p>&copy; %YEAR% ArtPing</p>
      <nav aria-label="Footer">
        <a href="/about.html">About</a>
      </nav>
    </footer>
  </main>

<script src="/js/forgot-password.js"></script>
</body>
</html>
