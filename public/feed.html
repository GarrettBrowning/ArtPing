<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/nav.js"></script>
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <div class="nav-links">
        <a href="feed.html" class="active">Feed</a>
        <a id="profile-link" href="#" class="show-signed-in">Profile</a>
        <a href="upload.html">Upload</a>
        <a href="login.html" class="show-signed-out">Login</a>
        <a href="register.html" class="show-signed-out">Register</a>
        <button id="logout" class="btn-ghost show-signed-in">Logout</button>
      </div>
    </nav>

    <main>
      <div class="feed-tabs" role="tablist">
        <button class="feed-tab active" data-tab="new" role="tab">Latest</button>
        <button class="feed-tab" data-tab="hot" role="tab">Trending</button>
        <button class="feed-tab" data-tab="following" role="tab">Following</button>
      </div>
      <div id="posts-grid" class="posts-grid"></div>
      <div class="feed-footer">
        <button id="load-more" class="btn-outline" style="display:none;">Load more</button>
        <p id="feed-status" class="feed-status"></p>
      </div>
    </main>
  </div>

  <script>
    const grid = document.getElementById('posts-grid');
    const loadMoreBtn = document.getElementById('load-more');
    const status = document.getElementById('feed-status');
    let nextCursor = null;
    let loading = false;
    let currentTab = 'new';
    let seenIds = new Set(); // Trending rankings can shift between pages, so skip repeats

    // Post titles/descriptions are user input, so escape before inserting as HTML
    function escapeHtml(str) {
      return String(str ?? '').replace(/[&<>"']/g, c => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function timeAgo(dateStr) {
      const seconds = Math.floor((Date.now() - new Date(dateStr)) / 1000);
      const units = [['y', 31536000], ['mo', 2592000], ['d', 86400], ['h', 3600], ['m', 60]];
      for (const [label, secs] of units) {
        if (seconds >= secs) return `${Math.floor(seconds / secs)}${label} ago`;
      }
      return 'just now';
    }

    function renderPost(post) {
      const profileUrl = `/profile.html?username=${encodeURIComponent(post.username)}`;
      return `
        <div class="post-card">
          <img src="${escapeHtml(post.filepath)}" alt="${escapeHtml(post.title)}" loading="lazy">
          <div class="post-card-info">
            <p class="post-title">${escapeHtml(post.title)}</p>
            ${post.description ? `<p class="post-desc">${escapeHtml(post.description)}</p>` : ''}
            <div class="post-meta">
              <span><a href="${profileUrl}">${escapeHtml(post.username)}</a> · ${timeAgo(post.createdAt)}</span>
              <button class="like-btn${post.likedByMe ? ' liked' : ''}" data-id="${post._id}"
                aria-pressed="${post.likedByMe}" aria-label="Like">
                <span class="like-heart">${post.likedByMe ? '♥' : '♡'}</span>
                <span class="like-count">${post.likeCount}</span>
              </button>
            </div>
          </div>
        </div>
      `;
    }

    const emptyMessages = {
      new: 'No posts yet. Be the first to <a href="upload.html">upload</a>!',
      hot: 'No posts yet. Be the first to <a href="upload.html">upload</a>!',
      following: 'Nothing here yet. Follow artists from their profile pages to see their posts here.',
    };

    async function loadFeed() {
      if (loading) return;
      loading = true;
      loadMoreBtn.disabled = true;
      status.textContent = '';

      try {
        const params = new URLSearchParams();
        if (currentTab === 'hot') params.set('sort', 'hot');
        if (currentTab === 'following') params.set('scope', 'following');
        if (nextCursor) params.set('cursor', nextCursor);

        const res = await fetch(`/api/feed?${params}`);
        if (res.status === 401) {
          grid.innerHTML = '<p style="color: var(--ink-faint);"><a href="login.html">Log in</a> to see posts from artists you follow.</p>';
          nextCursor = null;
          loadMoreBtn.style.display = 'none';
          return;
        }
        if (!res.ok) throw new Error(await res.text());
        const data = await res.json();

        const fresh = data.posts.filter(p => !seenIds.has(p._id));
        fresh.forEach(p => seenIds.add(p._id));

        if (!nextCursor && fresh.length === 0) {
          grid.innerHTML = `<p style="color: var(--ink-faint);">${emptyMessages[currentTab]}</p>`;
        } else {
          grid.insertAdjacentHTML('beforeend', fresh.map(renderPost).join(''));
        }

        nextCursor = data.nextCursor;
        loadMoreBtn.style.display = nextCursor ? 'inline-block' : 'none';
      } catch (e) {
        status.textContent = 'Could not load the feed. Please try again.';
      } finally {
        loading = false;
        loadMoreBtn.disabled = false;
      }
    }

    loadMoreBtn.addEventListener('click', loadFeed);

    // Switch tabs: reset and load from the top
    document.querySelectorAll('.feed-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        if (loading || tab.dataset.tab === currentTab) return;
        document.querySelectorAll('.feed-tab').forEach(t => t.classList.toggle('active', t === tab));
        currentTab = tab.dataset.tab;
        nextCursor = null;
        seenIds = new Set();
        grid.innerHTML = '';
        loadMoreBtn.style.display = 'none';
        loadFeed();
      });
    });

    // Like / unlike (one listener for every card, including ones added by Load more)
    grid.addEventListener('click', async (e) => {
      const btn = e.target.closest('.like-btn');
      if (!btn || btn.disabled) return;

      const wasLiked = btn.classList.contains('liked');
      btn.disabled = true;
      try {
        const res = await fetch(`/api/posts/${btn.dataset.id}/like`, { method: wasLiked ? 'DELETE' : 'POST' });
        if (res.status === 401) {
          location.href = '/login.html';
          return;
        }
        if (!res.ok) throw new Error(await res.text());
        const { liked, likeCount } = await res.json();
        btn.classList.toggle('liked', liked);
        btn.setAttribute('aria-pressed', liked);
        btn.querySelector('.like-heart').textContent = liked ? '♥' : '♡';
        btn.querySelector('.like-count').textContent = likeCount;
      } catch (err) {
        status.textContent = 'Could not update like. Please try again.';
      } finally {
        btn.disabled = false;
      }
    });



    loadFeed();
  </script>
</body>
</html>
