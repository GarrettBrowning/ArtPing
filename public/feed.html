<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/nav.js"></script>
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <div class="nav-links">
        <a href="feed.html" class="active">Feed</a>
        <a id="profile-link" href="#" class="show-signed-in">Profile</a>
        <a href="upload.html">Upload</a>
        <a href="reports.html" class="show-admin">Reports</a>
        <a href="settings.html" class="show-signed-in">Settings</a>
        <a href="login.html" class="show-signed-out">Login</a>
        <a href="register.html" class="show-signed-out">Register</a>
        <button id="logout" class="btn-ghost show-signed-in">Logout</button>
      </div>
    </nav>

    <main>
      <div class="feed-tabs" role="tablist">
        <button class="feed-tab active" data-tab="new" role="tab">Latest</button>
        <button class="feed-tab" data-tab="hot" role="tab">Trending</button>
        <button class="feed-tab" data-tab="following" role="tab">Following</button>
      </div>
      <div id="posts-grid" class="posts-grid"></div>
      <div class="feed-footer">
        <button id="load-more" class="btn-outline" style="display:none;">Load more</button>
        <p id="feed-status" class="feed-status"></p>
      </div>
    </main>
  </div>

  <script src="/posts.js"></script>
  <script src="/js/feed.js"></script>
</body>
</html>
