<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Reset Password</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/password-rules.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <p>Your creative space.</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Choose a New Password</h2>
      <p class="auth-sub">Pick a new password for your account. You'll be logged out everywhere else.</p>

      <p id="error-msg" style="color: red; display: none;"></p>
      <form id="reset-form" class="auth-form">
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" placeholder="Create a password" autocomplete="new-password" aria-describedby="password-rules" required>
          <ul id="password-rules"></ul>
        </div>
        <div class="field">
          <label for="password-repeat">Repeat new password</label>
          <input type="password" id="password-repeat" placeholder="Repeat password" autocomplete="new-password" required>
          <span class="field-note" id="match-note" aria-live="polite"></span>
        </div>
        <button type="submit" class="btn-primary full-width">Save new password</button>
        <p class="forgot"><a href="login.html">Back to login</a></p>
      </form>
    </div>
  </div>

<script>
  const form = document.getElementById('reset-form');
  const errorMsg = document.getElementById('error-msg');
  const password = document.getElementById('password');
  const repeat = document.getElementById('password-repeat');
  const token = new URLSearchParams(location.search).get('token');

  function showError(text) {
    errorMsg.textContent = text;
    errorMsg.style.display = 'block';
  }

  attachPasswordChecklist(password, document.getElementById('password-rules'));
  attachMatchCheck(password, repeat, document.getElementById('match-note'));

  if (!token) {
    form.style.display = 'none';
    errorMsg.innerHTML = 'Sorry, this reset link is missing or incomplete. <a href="forgot-password.html">Request a new one</a>.';
    errorMsg.style.display = 'block';
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.style.display = 'none';
    if (!passwordMeetsRules(password.value)) {
      return showError("Sorry, your password doesn't meet all the requirements yet. Check the list under the password box.");
    }
    if (password.value !== repeat.value) {
      return showError("Sorry, your passwords don't match. Please type the same password twice.");
    }

    const button = form.querySelector('button[type="submit"]');
    button.disabled = true;
    try {
      const res = await fetch('/api/password/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: password.value })
      });
      if (!res.ok) throw new Error(await res.text());
      location.href = '/login.html?reset=done';
    } catch (err) {
      showError(err.message || "Sorry, we couldn't reach the server. Please check your connection and try again.");
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
