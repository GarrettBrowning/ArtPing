<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Register</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/password-rules.js"></script>
</head>
<body>
  <div class="auth-page">
    <div class="auth-brand">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <p>Your creative space.</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Already have an account? <a href="login.html">Sign in</a></p>

      <p id="error-msg" style="color: red; display: none;"></p>
      <form id="register-form" class="auth-form">

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" maxlength="30" aria-describedby="username-hint" required>
          <span class="field-hint" id="username-hint">3–30 characters: letters, numbers and underscores (_)</span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" aria-describedby="password-rules" required>
          <ul id="password-rules"></ul>
        </div>
        <div class="field">
          <label for="password-repeat">Repeat Password</label>
          <input type="password" id="password-repeat" name="password-repeat" placeholder="Repeat password" autocomplete="new-password" required>
          <span class="field-note" id="match-note" aria-live="polite"></span>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" name="remember" checked> Remember me
        </label>
        <div class="auth-actions">
          <a href="index.html" class="btn-outline">Cancel</a>
          <button type="submit" class="btn-primary">Sign Up</button>
        </div>
      </form>
    </div>
  </div>
<script src="/js/register.js"></script>
</body>
</html>
