<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Create an account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <meta name="description" content="Join ArtPing for free to share your artwork, follow artists and get feedback on your art.">
  <meta name="theme-color" content="#f5f3f0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="canonical" href="%APP_URL%/register.html">
  <meta property="og:site_name" content="ArtPing">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ArtPing — Create an account">
  <meta property="og:description" content="Join ArtPing for free to share your artwork, follow artists and get feedback on your art.">
  <meta property="og:url" content="%APP_URL%/register.html">
  <meta property="og:image" content="%APP_URL%/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <script src="/password-rules.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
<main class="auth-page" id="main-content">
    <div class="auth-brand">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <p>Your creative space.</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Create Account</h2>
      <p class="auth-sub">Already have an account? <a href="login.html">Sign in</a></p>

      <p id="error-msg" style="color: red; display: none;"></p>
      <form id="register-form" class="auth-form">

        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" maxlength="30" aria-describedby="username-hint" required>
          <span class="field-hint" id="username-hint">3–30 characters: letters, numbers and underscores (_)</span>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Create a password" autocomplete="new-password" aria-describedby="password-rules" required>
          <ul id="password-rules"></ul>
        </div>
        <div class="field">
          <label for="password-repeat">Repeat Password</label>
          <input type="password" id="password-repeat" name="password-repeat" placeholder="Repeat password" autocomplete="new-password" required>
          <span class="field-note" id="match-note" aria-live="polite"></span>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" name="remember" checked> Remember me
        </label>
        <div class="auth-actions">
          <a href="index.html" class="btn-outline">Cancel</a>
          <button type="submit" class="btn-primary">Sign Up</button>
        </div>
      </form>
    </div>
    <footer class="site-footer">
      <p>&copy; %YEAR% ArtPing</p>
      <nav aria-label="Footer">
        <a href="/about.html">About</a>
      </nav>
    </footer>
  </main>
<script src="/js/register.js"></script>
</body>
</html>
