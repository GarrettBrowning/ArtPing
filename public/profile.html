<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <script src="/nav.js"></script>
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <div class="nav-links">
        <a href="feed.html">Feed</a>
        <a id="profile-link" href="#" class="show-signed-in">Profile</a>
        <a href="upload.html">Upload</a>
        <a href="reports.html" class="show-admin">Reports</a>
        <a href="settings.html" class="show-signed-in">Settings</a>
        <a href="login.html" class="show-signed-out">Login</a>
        <a href="register.html" class="show-signed-out">Register</a>
        <button id="logout" class="btn-ghost show-signed-in">Logout</button>
      </div>
    </nav>

    <main>
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-pfp-wrap">
          <img id="pfp-img" src="/images/default-pfp.webp" alt="Profile Picture" class="profile-pfp">
          <label id="pfp-edit-btn" class="pfp-edit-label" style="display:none;">
            Change Photo
            <input type="file" id="pfp-input" accept="image/png, image/jpeg, image/webp, image/gif" style="display:none;">
          </label>
        </div>
        <div class="profile-info">
          <h2 id="profile-username" class="profile-username"></h2>
          <p id="profile-pronouns" class="profile-pronouns"></p>
          <p id="profile-bio" class="profile-bio"></p>
          <p class="profile-follow-stats">
            <button type="button" class="follow-stat" data-list="followers"><strong id="follower-count">0</strong> followers</button>
            <button type="button" class="follow-stat" data-list="following"><strong id="following-count">0</strong> following</button>
          </p>
          <button id="edit-btn" class="btn-outline" style="display:none;">Edit Profile</button>
          <button id="follow-btn" class="btn-primary" style="display:none;">Follow</button>
        </div>
      </div>

      <!-- Edit Form (hidden by default) -->
      <div id="edit-form-container" style="display:none;">
        <div class="auth-card" style="max-width: 600px; margin: 24px 0;">
          <h3 class="auth-title" style="font-size: 1.4rem;">Edit Profile</h3>
          <form id="edit-form" class="auth-form">
            <div class="field">
              <label for="edit-pronouns">Pronouns</label>
              <input type="text" id="edit-pronouns" placeholder="e.g. they/them" maxlength="40">
            </div>
            <div class="field">
              <label for="edit-bio">Bio</label>
              <input type="text" id="edit-bio" placeholder="Tell us about yourself or your art" maxlength="500">
            </div>
            <p id="edit-error" style="color: red; display:none;"></p>
            <div class="auth-actions">
              <button type="button" class="btn-outline" id="cancel-edit-btn">Cancel</button>
              <button type="submit" class="btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Posts Grid -->
      <div class="profile-posts-header">
        <h3 class="section-title">Posts</h3>
      </div>
      <div id="posts-grid" class="posts-grid"></div>
      <div class="feed-footer">
        <button id="load-more-posts" class="btn-outline" style="display:none;">Load more</button>
      </div>
    </main>

    <!-- Followers / Following list -->
    <dialog id="follow-dialog" class="follow-dialog" aria-labelledby="follow-dialog-title">
      <div class="follow-dialog-header">
        <div class="feed-tabs follow-dialog-tabs" role="tablist" id="follow-dialog-title">
          <button type="button" class="feed-tab" data-list="followers" role="tab">Followers</button>
          <button type="button" class="feed-tab" data-list="following" role="tab">Following</button>
        </div>
        <button type="button" class="follow-dialog-close" aria-label="Close">&times;</button>
      </div>
      <ul id="follow-list" class="follow-list"></ul>
      <div class="feed-footer">
        <button type="button" id="follow-list-more" class="btn-outline" style="display:none;">Load more</button>
        <p id="follow-list-status" class="feed-status"></p>
      </div>
    </dialog>
  </div>

  <script src="/posts.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
