<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="app">
    <nav class="nav">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <div class="nav-links">
        <a href="upload.html">Upload</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
        <button id="logout" class="btn-ghost">Logout</button>
      </div>
    </nav>

    <main>
      <!-- Profile Header -->
      <div class="profile-header">
        <div class="profile-pfp-wrap">
          <img id="pfp-img" src="/images/default-pfp.png" alt="Profile Picture" class="profile-pfp">
          <label id="pfp-edit-btn" class="pfp-edit-label" style="display:none;">
            Change Photo
            <input type="file" id="pfp-input" accept="image/png, image/jpeg" style="display:none;">
          </label>
        </div>
        <div class="profile-info">
          <h2 id="profile-username" class="profile-username"></h2>
          <p id="profile-pronouns" class="profile-pronouns"></p>
          <p id="profile-bio" class="profile-bio"></p>
          <button id="edit-btn" class="btn-outline" style="display:none;">Edit Profile</button>
        </div>
      </div>

      <!-- Edit Form (hidden by default) -->
      <div id="edit-form-container" style="display:none;">
        <div class="auth-card" style="max-width: 600px; margin: 24px 0;">
          <h3 class="auth-title" style="font-size: 1.4rem;">Edit Profile</h3>
          <form id="edit-form" class="auth-form">
            <div class="field">
              <label for="edit-pronouns">Pronouns</label>
              <input type="text" id="edit-pronouns" placeholder="e.g. they/them">
            </div>
            <div class="field">
              <label for="edit-bio">Bio</label>
              <input type="text" id="edit-bio" placeholder="Tell us about yourself or your art">
            </div>
            <p id="edit-error" style="color: red; display:none;"></p>
            <div class="auth-actions">
              <button type="button" class="btn-outline" id="cancel-edit-btn">Cancel</button>
              <button type="submit" class="btn-primary">Save</button>
            </div>
          </form>
        </div>
      </div>

      <!-- Posts Grid -->
      <div class="profile-posts-header">
        <h3 class="section-title">Posts</h3>
      </div>
      <div id="posts-grid" class="posts-grid"></div>
    </main>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const username = params.get('username');
    let currentUser = null;
    let isOwner = false;

    // Get logged in user
    async function getMe() {
      const res = await fetch('/api/me');
      const data = await res.json();
      currentUser = data.username;
    }

    // Load profile
    async function loadProfile() {
      const res = await fetch(`/api/profile/${username}`);
      if (!res.ok) {
        document.querySelector('main').innerHTML = '<p style="color: var(--ink-muted); margin-top: 40px;">Profile not found.</p>';
        return;
      }
      const profile = res.ok ? await res.json() : null;

      document.getElementById('profile-username').textContent = profile.username;
      document.getElementById('profile-pronouns').textContent = profile.pronouns || '';
      document.getElementById('profile-bio').textContent = profile.bio || '';
      if (profile.pfp) document.getElementById('pfp-img').src = profile.pfp;

      // Show edit button if owner
      if (currentUser === username) {
        isOwner = true;
        document.getElementById('edit-btn').style.display = 'inline-block';
        document.getElementById('pfp-edit-btn').style.display = 'block';
        document.getElementById('edit-pronouns').value = profile.pronouns || '';
        document.getElementById('edit-bio').value = profile.bio || '';
      }
    }

    // Load posts
    async function loadPosts() {
      const res = await fetch(`/api/posts/${username}`);
      if (!res.ok) return;
      const posts = await res.json();
      const grid = document.getElementById('posts-grid');

      if (posts.length === 0) {
        grid.innerHTML = '<p style="color: var(--ink-faint);">No posts yet.</p>';
        return;
      }

      grid.innerHTML = posts.map(post => `
        <div class="post-card">
          <img src="${post.filepath}" alt="${post.title}">
          <div class="post-card-info">
            <p class="post-title">${post.title}</p>
            ${post.description ? `<p class="post-desc">${post.description}</p>` : ''}
          </div>
        </div>
      `).join('');
    }

    // Edit profile toggle
    document.getElementById('edit-btn').addEventListener('click', () => {
      document.getElementById('edit-form-container').style.display = 'block';
      document.getElementById('edit-btn').style.display = 'none';
    });

    document.getElementById('cancel-edit-btn').addEventListener('click', () => {
      document.getElementById('edit-form-container').style.display = 'none';
      document.getElementById('edit-btn').style.display = 'inline-block';
    });

    // Save profile
    document.getElementById('edit-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const bio = document.getElementById('edit-bio').value;
      const pronouns = document.getElementById('edit-pronouns').value;
      const errorMsg = document.getElementById('edit-error');

      const res = await fetch('/api/profile', {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ bio, pronouns })
      });

      if (res.ok) {
        document.getElementById('profile-bio').textContent = bio;
        document.getElementById('profile-pronouns').textContent = pronouns;
        document.getElementById('edit-form-container').style.display = 'none';
        document.getElementById('edit-btn').style.display = 'inline-block';
      } else {
        errorMsg.textContent = await res.text();
        errorMsg.style.display = 'block';
      }
    });

    // PFP upload
    document.getElementById('pfp-input').addEventListener('change', async () => {
      const file = document.getElementById('pfp-input').files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('pfp', file);

      const res = await fetch('/api/profile/pfp', {
        method: 'POST',
        body: formData
      });

      if (res.ok) {
        const data = await res.json();
        document.getElementById('pfp-img').src = data.pfp;
      }
    });

    // Logout
    document.getElementById('logout').addEventListener('click', async () => {
      const res = await fetch('/api/logout', { method: 'POST' });
      if (res.ok) location.href = '/login.html';
    });

    // Init
    (async () => {
      await getMe();
      if (!username) {
        if (currentUser) {
          location.href = `/profile.html?username=${encodeURIComponent(currentUser)}`;
        } else {
          location.href = '/login.html';
        }
        return;
      }
      await loadProfile();
      await loadPosts();
    })();
  </script>
</body>
</html>
