<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArtPing — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <meta name="description" content="Log in to ArtPing to share your artwork, follow artists and join the conversation.">
  <meta name="theme-color" content="#f5f3f0">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="canonical" href="%APP_URL%/login.html">
  <meta property="og:site_name" content="ArtPing">
  <meta property="og:type" content="website">
  <meta property="og:title" content="ArtPing — Log in">
  <meta property="og:description" content="Log in to ArtPing to share your artwork, follow artists and join the conversation.">
  <meta property="og:url" content="%APP_URL%/login.html">
  <meta property="og:image" content="%APP_URL%/images/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
<main class="auth-page" id="main-content">
    <div class="auth-brand">
      <a href="index.html" class="nav-logo">ArtPing</a>
      <p>Your creative space.</p>
    </div>

    <div class="auth-card">
      <h2 class="auth-title">Sign In</h2>
      <p class="auth-sub">Don't have an account? <a href="register.html">Register</a></p>

      <p id="success-msg" class="form-success" style="display: none;"></p>
      <p id="error-msg" style="color: red; display: none;"></p>
      <form id="login-form" class="auth-form">

        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter username" autocomplete="username" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
        </div>
        <label class="checkbox-label">
          <input type="checkbox" name="remember" checked> Remember me
        </label>
        <button type="submit" class="btn-primary full-width">Login</button>
        <a href="index.html" class="btn-outline full-width">Cancel</a>
        <p class="forgot"><a href="forgot-password.html">Forgot password?</a></p>
      </form>
    </div>
    <footer class="site-footer">
      <p>&copy; %YEAR% ArtPing</p>
      <nav aria-label="Footer">
        <a href="/about.html">About</a>
      </nav>
    </footer>
  </main>

<script src="/js/login.js"></script>

</body>
</html>
